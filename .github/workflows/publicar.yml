name: Publicar versiones del laboratorio
on:
  push:
    paths: ['app/**', '.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['1.0.0', '2.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: VERSION=${{ matrix.version }}
          tags: ghcr.io/miguelangel7521/com600-practica9-kubernetes:${{ matrix.version }}
